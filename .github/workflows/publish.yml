name: Publish to npm, Docker Hub, and MCP Registry

on:
  push:
    tags:
      - "v*" # v1.0.0 などのタグがプッシュされた時に実行
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # MCP RegistryへのGitHub OIDC認証に必須

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # ==========================================
      # 1. Docker イメージのビルドと公開 (Docker Hub)
      # ==========================================
      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/google-workspace-mcp-server
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f #v7.1.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # ==========================================
      # 2. npm パッケージのビルドと公開
      # ==========================================
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .tool-versions
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      # npm はタグの push でしか動かないが、ジョブを再実行したときに
      # 同じバージョンを publish しようとして止まらないよう、既に出ていればスキップする
      - name: Publish package to npm
        run: |
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"

          if npm view "$name@$version" version --prefer-online > /dev/null 2>&1; then
            echo "$name@$version は既に npm に公開済みのためスキップします。"
            exit 0
          fi

          npm publish --provenance --access public

      # ==========================================
      # 3. MCP Registry へのサーバー公開
      # ==========================================
      # MCP Registry は登録時に npm 側へ「そのバージョンが実在するか」を問い合わせる。
      # npm publish の直後は反映が間に合わず 404 になり、登録が失敗する（0.6.0 で実際に起きた）。
      # 反映を確認してから次へ進む。
      - name: Wait for the npm release to become visible
        run: |
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"

          for attempt in $(seq 1 30); do
            if npm view "$name@$version" version --prefer-online > /dev/null 2>&1; then
              echo "$name@$version が npm に反映されました（$attempt 回目）。"
              exit 0
            fi
            echo "npm への反映を待っています（$attempt/30）..."
            sleep 10
          done

          echo "npm に $name@$version が 5 分経っても現れませんでした。" >&2
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz
          chmod +x mcp-publisher

      - name: Authenticate to MCP Registry (OIDC)
        run: ./mcp-publisher login github-oidc

      # Registry は npm へ問い合わせてからバージョンを検証する。その HTTP が
      # タイムアウトして 400 になることがある（0.6.1 で発生）。数回やり直す。
      - name: Publish server to MCP Registry
        run: |
          for attempt in 1 2 3 4 5; do
            if ./mcp-publisher publish; then
              exit 0
            fi
            echo "MCP Registry への登録に失敗しました（$attempt/5）。30 秒後にやり直します。"
            sleep 30
          done

          echo "MCP Registry への登録が 5 回とも失敗しました。" >&2
          exit 1
